[project]
name = "commutesure-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "numpy>=2.0,<3", "pydantic-settings>=2.6,<3", "tzdata>=2025.2", "uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.pytest.ini_options]
addopts = "-q --cov=commutesure --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["commutesure"]
